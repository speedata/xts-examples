name: Check examples

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # once a week, so a new XTS release that changes the output is noticed
    - cron: "17 5 * * 1"

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install ImageMagick and Ghostscript
        # Only used by rake qa when a PDF differs from result.pdf by hash.
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ghostscript
          # Ubuntu's ImageMagick policy forbids reading PDF files; xts compare
          # rasterizes the PDFs with ImageMagick, so lift that restriction.
          sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml

      - name: Install the latest XTS release
        run: |
          url=$(curl -sL https://api.github.com/repos/speedata/xts/releases/latest | grep browser_download_url | grep linux-amd64 | cut -d '"' -f 4)
          curl -sL "$url" | tar xz
          echo "$PWD/xts-linux-amd64" >> "$GITHUB_PATH"
          "$PWD/xts-linux-amd64/xts" version

      - name: Compare every example with its result.pdf
        run: rake qa

      - name: Upload the comparison report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compare-report
          path: |
            compare-report.html
            **/pagediff-*.png
            **/source-*.png
            **/result-*.png
