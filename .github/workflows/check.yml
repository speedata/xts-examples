name: Check examples

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # once a week, so a new XTS release that changes the output is noticed
    - cron: "17 5 * * 1"

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install the latest XTS release
        run: |
          url=$(curl -sL https://api.github.com/repos/speedata/xts/releases/latest | grep browser_download_url | grep linux-amd64 | cut -d '"' -f 4)
          curl -sL "$url" | tar xz
          echo "$PWD/xts-linux-amd64" >> "$GITHUB_PATH"
          "$PWD/xts-linux-amd64/xts" version

      - name: Compare every example with its result.pdf
        run: rake qa

      - name: Upload the differing PDFs on failure
        # rake qa keeps xts.pdf only where it differs from result.pdf.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: differing-pdfs
          path: "**/xts.pdf"
